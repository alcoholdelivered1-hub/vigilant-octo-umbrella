    <script>
      // Register the Firebase messaging service worker early so it controls the
      // root scope (with its fetch handler) on first visit — this, plus the
      // linked manifest.json, makes the site an installable PWA on Android
      // (Chrome → "Install app" → adds to home screen, no Play Store needed).
      // Registering the existing SW is safe and is also the documented FCM setup
      // pattern; Firebase adopts the already-active registration later.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(function () {});
        });
      }
    </script>
